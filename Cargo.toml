[package]
name = "rust_chat_app"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.4"
actix-files = "0.6"
actix = "0.13"
actix-web-actors = "4.2"
actix-multipart = "0.6"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1.34", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
ammonia = "3.3" # For strict HTML sanitization
futures-util = "0.3"
time = "0.3"